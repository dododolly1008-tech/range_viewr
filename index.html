<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>簡易プリフロップレンジビューア</title>

  <!-- （任意）キャッシュ抑制。更新が反映されにくいとき用 -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      background: #111827;
      color: #e5e7eb;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      text-align: center;
    }
    h2 {
      font-size: 16px;
      margin: 20px 0 8px;
      text-align: center;
    }
    .controls {
      margin: 8px auto 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      justify-content: center;
      max-width: 640px;
    }
    .controls label {
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .color-chip {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid #00000040;
    }
    .reset-btn {
      padding: 4px 10px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #4b5563;
      cursor: pointer;
      background: #111827;
      color: #e5e7eb;
    }

    .grid-wrapper {
      overflow-x: auto;
      max-width: 100%;
      margin: 0 auto;
      text-align: center;   /* 表を中央寄せ */
    }
    .grid-container {
      display: inline-block;
      padding: 12px;
      border-radius: 18px;
      background: #020617;
      box-shadow: 0 12px 30px #00000080;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(14, 28px);
      gap: 2px;
      user-select: none;
    }
    .cell {
      width: 28px;
      height: 28px;
      font-size: 11px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.05s, box-shadow 0.1s;
      color: #f9fafb;
    }
    .cell.header {
      font-weight: bold;
      cursor: pointer;   /* 行・列ヘッダもタップ可能 */
      background: transparent;
      color: #9ca3af;
    }

    /* ===== 色ごとのバケツ =====
       1: 紫, 2: 赤, 3: オレンジ, 4: 黄,
       5: 濃い緑, 6: 黄緑, 7: 水色, 8: 白, 9: グレー
       0: 黒（レンジ外）
    */

    .bucket-0 {
      background: #000000;
      color: #4b5563;
    }

    .bucket-1 { background: #7c3aed; }                    /* 紫 */
    .bucket-2 { background: #ef4444; }                    /* 赤 */
    .bucket-3 { background: #f97316; }                    /* オレンジ */
    .bucket-4 { background: #facc15; color: #111827; }    /* 黄 */
    .bucket-5 { background: #166534; }                    /* 濃い緑 */
    .bucket-6 { background: #a3e635; color: #111827; }    /* 黄緑 */
    .bucket-7 { background: #38bdf8; color: #0f172a; }    /* 水色 */
    .bucket-8 { background: #f9fafb; color: #111827; }    /* 白 */
    .bucket-9 { background: #9ca3af; color: #111827; }    /* グレー */

    .bucket-hidden {
      opacity: 0.15;
    }
    .manual-hide {
      opacity: 0.04 !important;
    }
    .cell:not(.header):active {
      transform: scale(0.94);
      box-shadow: 0 0 0 1px #e5e7eb80;
    }

    /* 行・列ハイライト（濃いピンク枠） */
    .row-highlight,
    .col-highlight {
      box-shadow: 0 0 0 3px #ec4899 inset;
    }
    .row-highlight.col-highlight {
      box-shadow: 0 0 0 3px #ec4899 inset, 0 0 0 1px #ec4899;
    }
    .header-active {
      color: #f472b6;
      text-shadow: 0 0 4px #ec4899;
    }

    /* ===== ハンド履歴エリア ===== */
    .hh-section {
      margin: 32px auto 0;
      max-width: 960px;
    }
    .hh-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      font-size: 13px;
      margin-bottom: 8px;
      justify-content: center;
    }
    .hh-controls button {
      padding: 4px 10px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #4b5563;
      cursor: pointer;
      background: #111827;
      color: #e5e7eb;
    }
    .hh-controls input[type="number"] {
      width: 80px;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
    }
    .hh-controls select {
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
    }
    .hh-file-name {
      font-size: 12px;
      color: #9ca3af;
    }
    .hh-error {
      color: #f87171;
      font-size: 13px;
      margin: 4px 0 8px;
      text-align: center;
    }
    .hh-results {
      background: #020617;
      border-radius: 8px;
      padding: 10px;
      max-height: 420px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>簡易プリフロップレンジ</h1>

  <!-- 自分のレンジ -->
  <h2>自分のレンジ</h2>
  <div class="controls" id="heroControls">
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="1" checked>
      <span class="color-chip" style="background:#7c3aed"></span> 紫
    </label>
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="2" checked>
      <span class="color-chip" style="background:#ef4444"></span> 赤
    </label>
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="3" checked>
      <span class="color-chip" style="background:#f97316"></span> オレンジ
    </label>
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="4" checked>
      <span class="color-chip" style="background:#facc15"></span> 黄
    </label>
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="5" checked>
      <span class="color-chip" style="background:#166534"></span> 濃い緑
    </label>
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="6" checked>
      <span class="color-chip" style="background:#a3e635"></span> 黄緑
    </label>
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="7" checked>
      <span class="color-chip" style="background:#38bdf8"></span> 水色
    </label>
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="8" checked>
      <span class="color-chip" style="background:#f9fafb;border:1px solid #9ca3af"></span> 白
    </label>
    <label>
      <input type="checkbox" data-grid="hero" data-bucket="9" checked>
      <span class="color-chip" style="background:#9ca3af"></span> グレー
    </label>

    <button id="heroReset" class="reset-btn">自分レンジをリセット</button>
  </div>

  <div class="grid-wrapper">
    <div class="grid-container">
      <div id="heroGrid" class="grid"></div>
    </div>
  </div>

  <!-- 相手のレンジ -->
  <h2>相手のレンジ</h2>
  <div class="controls" id="villainControls">
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="1" checked>
      <span class="color-chip" style="background:#7c3aed"></span> 紫
    </label>
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="2" checked>
      <span class="color-chip" style="background:#ef4444"></span> 赤
    </label>
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="3" checked>
      <span class="color-chip" style="background:#f97316"></span> オレンジ
    </label>
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="4" checked>
      <span class="color-chip" style="background:#facc15"></span> 黄
    </label>
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="5" checked>
      <span class="color-chip" style="background:#166534"></span> 濃い緑
    </label>
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="6" checked>
      <span class="color-chip" style="background:#a3e635"></span> 黄緑
    </label>
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="7" checked>
      <span class="color-chip" style="background:#38bdf8"></span> 水色
    </label>
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="8" checked>
      <span class="color-chip" style="background:#f9fafb;border:1px solid #9ca3af"></span> 白
    </label>
    <label>
      <input type="checkbox" data-grid="villain" data-bucket="9" checked>
      <span class="color-chip" style="background:#9ca3af"></span> グレー
    </label>

    <button id="villainReset" class="reset-btn">相手レンジをリセット</button>
  </div>

  <div class="grid-wrapper">
    <div class="grid-container">
      <div id="villainGrid" class="grid"></div>
    </div>
  </div>

  <!-- ハンド履歴エリア -->
  <div class="hh-section">
    <h2>ハンド履歴</h2>

    <div class="hh-controls">
      <button id="hhImportBtn">HHを取り込む</button>
      <span class="hh-file-name" id="hhFileName">ファイル未選択</span>

      <span>／</span>

      <input type="number" id="hhThreshold" min="0" step="0.5" placeholder="10">
      <span>bb以上チップを</span>
      <select id="hhDirection">
        <option value="won">得た</option>
        <option value="lost">失った</option>
      </select>
      <span>ハンド</span>

      <button id="hhShowBtn">履歴を表示</button>
    </div>

    <input type="file" id="hhFileInput" accept=".txt,.log,.hh,.rtf,.html,.*" style="display:none">

    <div id="hhError" class="hh-error"></div>
    <div id="hhResults" class="hh-results"></div>
  </div>

  <script>
    const ranks = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];

    // 自分用レンジ
    const strengthMapHero = {
      // A 〜
      'AA': 1,
      'AKs': 1, 'AQs': 2, 'AJs': 3, 'ATs': 4, 'A9s': 5, 'A8s': 6, 'A7s': 6, 'A6s': 6, 'A5s': 6, 'A4s': 6, 'A3s': 6, 'A2s': 6,
      'AKo': 1, 'AQo': 4, 'AJo': 5, 'ATo': 6, 'A9o': 7, 'A8o': 8, 'A7o': 8, 'A6o': 8, 'A5o': 8, 'A4o': 0, 'A3o': 0, 'A2o': 0,

      // K 〜
      'KK': 1,
      'KQs': 3, 'KJs': 4, 'KTs': 5, 'K9s': 6, 'K8s': 7, 'K7s': 7, 'K6s': 7, 'K5s': 7, 'K4s': 7, 'K3s': 7, 'K2s': 7,
      'KQo': 5, 'KJo': 6, 'KTo': 7, 'K9o': 8, 'K8o': 0, 'K7o': 0, 'K6o': 0, 'K5o': 0, 'K4o': 0, 'K3o': 0, 'K2o': 0,

      // Q 〜
      'QQ': 1,
      'QJs': 5, 'QTs': 6, 'Q9s': 6, 'Q8s': 7, 'Q7s': 8, 'Q6s': 8, 'Q5s': 8, 'Q4s': 8, 'Q3s': 8, 'Q2s': 8,
      'QJo': 7, 'QTo': 8, 'Q9o': 8, 'Q8o': 0, 'Q7o': 0, 'Q6o': 0, 'Q5o': 0, 'Q4o': 0, 'Q3o': 0, 'Q2o': 0,

      // J 〜
      'JJ': 2,
      'JTs': 6, 'J9s': 6, 'J8s': 7, 'J7s': 8, 'J6s': 9, 'J5s': 9, 'J4s': 9, 'J3s': 9, 'J2s': 9,
      'JTo': 8, 'J9o': 8, 'J8o': 0, 'J7o': 0, 'J6o': 0, 'J5o': 0, 'J4o': 0, 'J3o': 0, 'J2o': 0,

      // T 〜
      'TT': 3,
      'T9s': 6, 'T8s': 7, 'T7s': 8, 'T6s': 9, 'T5s': 0, 'T4s': 0, 'T3s': 0, 'T2s': 0,
      'T9o': 8, 'T8o': 0, 'T7o': 0, 'T6o': 0, 'T5o': 0, 'T4o': 0, 'T3o': 0, 'T2o': 0,

      // 9 〜
      '99': 4,
      '98s': 7, '97s': 8, '96s': 9, '95s': 0, '94s': 0, '93s': 0, '92s': 0,
      '98o': 0, '97o': 0, '96o': 0, '95o': 0, '94o': 0, '93o': 0, '92o': 0,

      // 8 〜
      '88': 5,
      '87s': 8, '86s': 9, '85s': 0, '84s': 0, '83s': 0, '82s': 0,
      '87o': 0, '86o': 0, '85o': 0, '84o': 0, '83o': 0, '82o': 0,

      // 7 〜
      '77': 6,
      '76s': 8, '75s': 9, '74s': 0, '73s': 0, '72s': 0,
      '76o': 0, '75o': 0, '74o': 0, '73o': 0, '72o': 0,

      // 6 〜
      '66': 6,
      '65s': 8, '64s': 9, '63s': 0, '62s': 0,
      '65o': 0, '64o': 0, '63o': 0, '62o': 0,

      // 5 〜
      '55': 6,
      '54s': 8, '53s': 0, '52s': 0,
      '54o': 0, '53o': 0, '52o': 0,

      // 4 〜
      '44': 7,
      '43s': 0, '42s': 0,
      '43o': 0, '42o': 0,

      // 3 〜
      '33': 7,
      '32s': 0,
      '32o': 0,

      // 2 〜
      '22': 7,
    };

    // 相手用レンジ（初期値は自分と同じ）
    const strengthMapVillain = { ...strengthMapHero };

    // 行ハイライト
    function toggleRowHighlight(gridName, rank, headerEl) {
      const isActive = headerEl.classList.toggle('header-active');
      document
        .querySelectorAll(`.cell[data-grid="${gridName}"][data-row-rank="${rank}"]:not(.header)`)
        .forEach(cell => {
          if (isActive) {
            cell.classList.add('row-highlight');
          } else {
            cell.classList.remove('row-highlight');
          }
        });
    }

    // 列ハイライト
    function toggleColHighlight(gridName, rank, headerEl) {
      const isActive = headerEl.classList.toggle('header-active');
      document
        .querySelectorAll(`.cell[data-grid="${gridName}"][data-col-rank="${rank}"]:not(.header)`)
        .forEach(cell => {
          if (isActive) {
            cell.classList.add('col-highlight');
          } else {
            cell.classList.remove('col-highlight');
          }
        });
    }

    // グリッド生成
    function createGrid(gridId, strengthMap, gridName) {
      const gridEl = document.getElementById(gridId);

      const emptyHeader = document.createElement('div');
      emptyHeader.className = 'cell header';
      emptyHeader.dataset.grid = gridName;
      gridEl.appendChild(emptyHeader);

      // 上ヘッダ
      for (let c = 0; c < ranks.length; c++) {
        const rank = ranks[c];
        const h = document.createElement('div');
        h.className = 'cell header';
        h.textContent = rank;
        h.dataset.grid = gridName;
        h.dataset.headerType = 'col';
        h.dataset.rank = rank;
        h.addEventListener('click', () => toggleColHighlight(gridName, rank, h));
        gridEl.appendChild(h);
      }

      // 行
      for (let r = 0; r < ranks.length; r++) {
        const rowRank = ranks[r];

        const rowHeader = document.createElement('div');
        rowHeader.className = 'cell header';
        rowHeader.textContent = rowRank;
        rowHeader.dataset.grid = gridName;
        rowHeader.dataset.headerType = 'row';
        rowHeader.dataset.rank = rowRank;
        rowHeader.addEventListener('click', () => toggleRowHighlight(gridName, rowRank, rowHeader));
        gridEl.appendChild(rowHeader);

        for (let c = 0; c < ranks.length; c++) {
          const colRank = ranks[c];
          const cell = document.createElement('div');
          cell.className = 'cell';

          let key;
          if (r === c) {
            key = rowRank + colRank;
          } else if (r < c) {
            key = rowRank + colRank + 's';
          } else {
            key = colRank + rowRank + 'o';
          }

          cell.dataset.hand = key;
          cell.dataset.grid = gridName;
          cell.dataset.rowRank = rowRank;
          cell.dataset.colRank = colRank;

          const bucket = strengthMap[key] || 0;
          cell.dataset.bucket = bucket;
          cell.classList.add(`bucket-${bucket}`);

          cell.textContent = key;

          // 個別ON/OFF
          cell.addEventListener('click', () => {
            if (cell.classList.contains('manual-hide')) {
              cell.classList.remove('manual-hide');
            } else {
              cell.classList.add('manual-hide');
            }
          });

          gridEl.appendChild(cell);
        }
      }
    }

    createGrid('heroGrid', strengthMapHero, 'hero');
    createGrid('villainGrid', strengthMapVillain, 'villain');

    // バケツ表示/非表示
    document.querySelectorAll('.controls input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const bucket = cb.dataset.bucket;
        const gridName = cb.dataset.grid;
        const checked = cb.checked;

        document
          .querySelectorAll(`.cell[data-grid="${gridName}"][data-bucket="${bucket}"]`)
          .forEach(cell => {
            if (!cell.classList.contains('header')) {
              if (checked) {
                cell.classList.remove('bucket-hidden');
              } else {
                cell.classList.add('bucket-hidden');
              }
            }
          });
      });
    });

    // リセット
    function setupReset(resetId, gridName) {
      const btn = document.getElementById(resetId);
      btn.addEventListener('click', () => {
        document
          .querySelectorAll(`.controls input[data-grid="${gridName}"]`)
          .forEach(cb => cb.checked = true);

        document
          .querySelectorAll(`.cell[data-grid="${gridName}"]`)
          .forEach(cell => {
            cell.classList.remove('bucket-hidden');
            cell.classList.remove('manual-hide');
            cell.classList.remove('row-highlight');
            cell.classList.remove('col-highlight');
          });

        document
          .querySelectorAll(`.cell.header[data-grid="${gridName}"]`)
          .forEach(h => h.classList.remove('header-active'));
      });
    }

    setupReset('heroReset', 'hero');
    setupReset('villainReset', 'villain');

    /* ===== ハンド履歴：PokerStars HH パーサ ===== */

    let parsedHands = []; // { raw, netBB }

    function parseHandsFromText(text) {
      parsedHands = [];

      // 「PokerStars Hand #」と「PokerStars ハンド番号」の前で分割
      const chunks = text.split(/(?=PokerStars (?:Hand #|ハンド番号))/g);

      for (let chunk of chunks) {
        const trimmed = chunk.trim();
        if (!trimmed) continue;
        if (!/PokerStars (Hand #|ハンド番号)/.test(trimmed)) continue;

        // ($0.01/$0.02 USD) から BB を取得（2番目）
        const blindMatch = trimmed.match(/\((?:\$)?(\d+(?:\.\d+)?)\/(?:\$)?(\d+(?:\.\d+)?)/);
        if (!blindMatch) continue;
        const bb = parseFloat(blindMatch[2]);
        if (!bb || !isFinite(bb)) continue;

        // ヒーロー名（「○○ : 手札は [..]」の行から）
        const heroName = findHeroName(trimmed);
        if (!heroName) continue;

        const netChips = calcNetChipsForHero(trimmed, heroName);
        const netBB = netChips / bb;

        if (!isNaN(netBB)) {
          parsedHands.push({
            raw: trimmed,
            netBB: netBB,
          });
        }
      }
    }

    function findHeroName(handText) {
      const lines = handText.split('\n');
      for (let line of lines) {
        if (line.includes('手札は')) {
          const colonIdx = line.indexOf(':');
          if (colonIdx > 0) {
            return line.slice(0, colonIdx).trim();
          }
        }
      }
      return null;
    }

    // 1ハンドでの最終損益（ドル）を計算
    function calcNetChipsForHero(handText, heroName) {
      const lines = handText.split('\n');
      let invested = 0;
      let collected = 0;
      let returned = 0;

      const heroPrefix = heroName + ':';
      const heroPrefixSpace = heroName + ' :';

      for (let rawLine of lines) {
        const line = rawLine.trim();

        const isHeroLine =
          line.startsWith(heroPrefix) || line.startsWith(heroPrefixSpace);

        // ヒーローのポスト/ベット/コール/レイズ
        if (isHeroLine) {
          if (line.includes('ポスト') || line.includes('ベット') || line.includes('コール')) {
            const m = line.match(/\$([0-9]+(?:\.[0-9]+)?)/);
            if (m) invested += parseFloat(m[1]);
          }

          if (line.includes('レイズ')) {
            const nums = [...line.matchAll(/\$([0-9]+(?:\.[0-9]+)?)/g)].map(m => parseFloat(m[1]));
            if (nums.length >= 2) {
              invested += nums[0];  // 「$0.15 $0.20」→ 0.15 だけ増加
            } else if (nums.length === 1) {
              invested += nums[0];
            }
          }
        }

        // 「○○ はポットの$Xを獲得。」
        if (line.includes('はポットの$') && line.includes('を獲得')) {
          const m = line.match(/(.+?) はポットの\$([0-9]+(?:\.[0-9]+)?)を獲得/);
          if (m) {
            const name = m[1].trim();
            const amount = parseFloat(m[2]);
            if (name === heroName) collected += amount;
          }
        }

        // 「コールされなかったベット ($X) は○○に戻されました。」
        if (line.includes('コールされなかったベット') && line.includes('戻されました')) {
          const m = line.match(/コールされなかったベット \(\$([0-9]+(?:\.[0-9]+)?)\) は(.+?)に戻されました/);
          if (m) {
            const amount = parseFloat(m[1]);
            const name = m[2].trim().replace(/。$/, '');
            if (name === heroName) returned += amount;
          }
        }

        // サマリの「シート n: 名前 (...) 集める ($X)」
        if (line.includes('集める ($')) {
          const m = line.match(/シート \d+: ([^(]+)\([^)]*\)\s*集める \(\$([0-9]+(?:\.[0-9]+)?)\)/);
          if (m) {
            const name = m[1].trim();
            const amount = parseFloat(m[2]);
            if (name === heroName) collected += amount;
          }
        }
      }

      // 最終損益（ドル）
      return collected + returned - invested;
    }

    // UI要素
    const hhImportBtn = document.getElementById('hhImportBtn');
    const hhFileInput = document.getElementById('hhFileInput');
    const hhFileName = document.getElementById('hhFileName');
    const hhThresholdInput = document.getElementById('hhThreshold');
    const hhDirectionSelect = document.getElementById('hhDirection');
    const hhShowBtn = document.getElementById('hhShowBtn');
    const hhErrorEl = document.getElementById('hhError');
    const hhResultsEl = document.getElementById('hhResults');

    hhImportBtn.addEventListener('click', () => {
      hhFileInput.click();
    });

    hhFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      hhFileName.textContent = file.name;
      hhErrorEl.textContent = '読み込み中…';
      hhResultsEl.textContent = '';

      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result.toString();
        parseHandsFromText(text);
        if (parsedHands.length === 0) {
          hhErrorEl.textContent = '有効なPokerStarsハンド履歴が見つかりませんでした。';
        } else {
          hhErrorEl.textContent = `ハンドを ${parsedHands.length} 件読み込みました。条件を設定して「履歴を表示」を押してください。`;
        }
      };
      reader.onerror = () => {
        hhErrorEl.textContent = 'ファイルの読み込みに失敗しました。';
      };
      reader.readAsText(file);
    });

    hhShowBtn.addEventListener('click', () => {
      hhResultsEl.textContent = '';
      hhErrorEl.textContent = '';

      if (!parsedHands || parsedHands.length === 0) {
        hhErrorEl.textContent = 'ハンド履歴が取り込まれていません。先に「HHを取り込む」でファイルを選んでください。';
        return;
      }

      const th = parseFloat(hhThresholdInput.value);
      if (!(th > 0)) {
        hhErrorEl.textContent = '絞り込み条件（◯◯bb以上）を入力してください。';
        return;
      }

      const dir = hhDirectionSelect.value; // 'won' or 'lost'
      if (!dir) {
        hhErrorEl.textContent = '「得た」か「失った」を選択してください。';
        return;
      }

      let filtered = parsedHands.filter(h => {
        if (dir === 'won') return h.netBB >= th;   // プラス
        return h.netBB <= -th;                     // マイナス
      });

      if (filtered.length === 0) {
        hhErrorEl.textContent = '条件に一致するハンドがありませんでした。';
        return;
      }

      if (filtered.length > 30) {
        hhErrorEl.textContent = `条件に一致するハンドが ${filtered.length} 件あります。30件を超えるため表示しません。閾値を上げるなどして再度絞り込んでください。`;
        return;
      }

      const parts = filtered.map((h, idx) => {
        const sign = h.netBB >= 0 ? '+' : '';
        const header = `#${idx + 1}  Net: ${sign}${h.netBB.toFixed(1)} bb`;
        return header + '\n' + h.raw;
      });

      hhResultsEl.textContent = parts.join('\n\n────────────────────\n\n');
    });
  </script>
</body>
</html>
